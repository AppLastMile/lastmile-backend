services:
  db:
    image: postgres:16
    container_name: lastmile-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lastmile
    ports:
      - '5432:5432'
    volumes:
      - lastmile_db_data:/var/lib/postgresql/data

volumes:
  lastmile_db_data:
